services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: resolutor
      POSTGRES_USER: resolutor
      POSTGRES_PASSWORD: resolutor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolutor -d resolutor"]
      interval: 5s
      timeout: 5s
      retries: 10

  resolutor:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: compose
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/resolutor
      SPRING_DATASOURCE_USERNAME: resolutor
      SPRING_DATASOURCE_PASSWORD: resolutor
    depends_on:
      postgres:
        condition: service_healthy
