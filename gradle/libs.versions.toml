[versions]
java = "21"
spring-boot = "3.3.5"
spring-dependency-management = "1.1.6"
spotless = "6.25.0"
google-java-format = "1.22.0"
errorprone-plugin = "4.0.1"
errorprone-core = "2.31.0"
nullaway = "0.11.2"
junit = "5.11.3"
assertj = "3.26.3"
archunit = "1.3.0"
jspecify = "1.0.0"
testcontainers = "1.20.4"
springdoc = "2.6.0"
shedlock = "5.16.0"
resilience4j = "2.2.0"
wiremock = "3.9.2"
logstash-logback-encoder = "8.0"
jmh = "0.7.2"

[libraries]
# Test
junit-bom            = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter        = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core         = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5      = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom   = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgres = { module = "org.testcontainers:postgresql" }

# Adapter
springdoc-openapi    = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Leadership / resilience
shedlock-spring      = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-jdbc-template = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }

# Test-only
wiremock             = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }

# Static analysis
errorprone-core      = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }
nullaway             = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify             = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

[plugins]
spring-boot                  = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless                     = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone                   = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
jmh                          = { id = "me.champeau.jmh", version.ref = "jmh" }
